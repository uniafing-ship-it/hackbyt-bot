openapi: 3.1.0
info:
  title: Hackbyt Publisher API
  version: 1.1.0
  description: Publish one approved Hackbyt Telegram post as a single photo message with a caption. The image can come directly from the current ChatGPT conversation through openaiFileIdRefs.
servers:
  - url: https://hackbyt-bot.vercel.app
paths:
  /api/publish:
    post:
      operationId: publishHackbytImage
      summary: Publish an image post to @hackbyt
      description: Publishes exactly ONE approved Telegram post to @hackbyt. The post consists of one image and its caption. Do not call this operation unless the user explicitly asks to publish. For an image from the current ChatGPT conversation, pass exactly one image in openaiFileIdRefs. ChatGPT will populate the file reference with name, id, mime_type and a temporary HTTPS download_link. Do not invent a download_link.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - openaiFileIdRefs
                - caption
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  description: Exactly one image from the current ChatGPT conversation. It may be a user-uploaded image or an image generated in the conversation. At runtime ChatGPT supplies the file reference object containing name, id, mime_type and a temporary HTTPS download_link.
                  items:
                    type: string
                caption:
                  type: string
                  maxLength: 900
                  description: Final Telegram caption for the image. Use Telegram-compatible HTML such as <b>...</b>. Keep it at or below 900 characters so it fits safely into a single photo post.
      responses:
        '200':
          description: The image and caption were published as one Telegram message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: integer
                  channel:
                    type: string
                  type:
                    type: string
                  caption_truncated:
                    type: boolean
        '400':
          description: Invalid image or caption.
        '401':
          description: Invalid API key or session.
        '500':
          description: Server or Telegram error.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
