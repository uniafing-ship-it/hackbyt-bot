<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hackbyt — публикация</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;background:#f5f5f5;color:#111}
    .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}
    h1{margin-top:0}.drop{border:2px dashed #aaa;border-radius:14px;padding:36px;text-align:center;cursor:pointer}.drop.drag{border-color:#111;background:#fafafa}
    img{max-width:100%;max-height:520px;border-radius:12px;margin-top:16px;display:none}
    textarea{width:100%;box-sizing:border-box;margin-top:16px;padding:12px;border:1px solid #ccc;border-radius:10px;min-height:80px}
    button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:14px;font-weight:600}
  </style>
</head>
<body>
<div class="card">
  <h1>Hackbyt — публикация</h1>
  <p>Выбери картинку, созданную в ChatGPT, добавь подпись при необходимости и нажми «Опубликовать».</p>
  <div id="drop" class="drop">Нажми или перетащи изображение сюда<input id="file" type="file" accept="image/*" hidden></div>
  <img id="preview" alt="Предпросмотр">
  <textarea id="caption" placeholder="Подпись (необязательно)"></textarea>
  <button id="publish" disabled>Опубликовать в @hackbyt</button>
  <div id="status" class="status"></div>
</div>
<script>
const drop=document.getElementById('drop'),fileInput=document.getElementById('file'),preview=document.getElementById('preview'),publish=document.getElementById('publish'),status=document.getElementById('status');
let file=null;
drop.onclick=()=>fileInput.click();
fileInput.onchange=()=>setFile(fileInput.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};
drop.ondragleave=()=>drop.classList.remove('drag');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');setFile(e.dataTransfer.files[0])};
function setFile(f){if(!f||!f.type.startsWith('image/'))return;file=f;preview.src=URL.createObjectURL(f);preview.style.display='block';publish.disabled=false;status.textContent='';}
function readBase64(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})}
publish.onclick=async()=>{if(!file)return;publish.disabled=true;status.textContent='Публикую…';try{const image_base64=await readBase64(file);const r=await fetch('/api/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image_base64,content_type:file.type,filename:file.name,caption:document.getElementById('caption').value})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'Ошибка публикации');status.textContent='Опубликовано в @hackbyt. Сообщение ID: '+data.message_id;}catch(e){status.textContent='Ошибка: '+e.message;publish.disabled=false;}};
</script>
</body>
</html>
