<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hackbyt — публикация</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;max-width:760px;margin:32px auto;padding:0 18px;background:#f5f5f5;color:#111}.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 4px 24px #0001}h1{margin:0 0 8px}.sub{color:#666;margin:0 0 20px}.drop{border:2px dashed #aaa;border-radius:16px;padding:42px 20px;text-align:center;cursor:pointer;transition:.15s}.drop.drag{border-color:#111;background:#fafafa;transform:scale(1.01)}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop span{color:#666;font-size:14px}#file{display:none}img{max-width:100%;max-height:520px;border-radius:14px;margin-top:18px;display:none}textarea,input{width:100%;padding:12px;margin-top:16px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:100px;resize:vertical}input[type=password]{font-family:monospace}button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:14px;font-weight:600}.hint{font-size:13px;color:#666;margin-top:8px}.meta{display:none;margin-top:10px;color:#666;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>Hackbyt — публикация</h1>
<p class="sub">Подготовь картинку в ChatGPT, перетащи её сюда и опубликуй в @hackbyt.</p>
<div id="drop" class="drop"><strong>Перетащи изображение сюда</strong><span>или нажми, чтобы выбрать файл</span><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></div>
<div id="meta" class="meta"></div>
<img id="preview" alt="Предпросмотр">
<textarea id="caption" placeholder="Подпись к изображению (необязательно)"></textarea>
<input id="key" type="password" placeholder="PUBLISH_API_KEY" autocomplete="off">
<div class="hint">Ключ не сохраняется и передаётся только запросу на Vercel API.</div>
<button id="publish" disabled>Опубликовать в @hackbyt</button>
<div id="status" class="status"></div>
</div>
<script>
const drop=document.getElementById('drop'),fileInput=document.getElementById('file'),preview=document.getElementById('preview'),publish=document.getElementById('publish'),status=document.getElementById('status'),keyInput=document.getElementById('key'),caption=document.getElementById('caption'),meta=document.getElementById('meta');let file=null;
drop.addEventListener('click',()=>fileInput.click());fileInput.addEventListener('change',()=>setFile(fileInput.files[0]));drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');setFile(e.dataTransfer.files[0])});
function setFile(f){if(!f||!f.type.startsWith('image/')){status.textContent='Выбери изображение PNG, JPEG или WebP.';return}file=f;preview.src=URL.createObjectURL(f);preview.style.display='block';meta.style.display='block';meta.textContent=`${f.name} · ${(f.size/1024/1024).toFixed(2)} МБ`;publish.disabled=false;status.textContent='Изображение готово к публикации.';}
function readBase64(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})}
publish.addEventListener('click',async()=>{if(!file)return;if(!keyInput.value.trim()){status.textContent='Введите PUBLISH_API_KEY.';keyInput.focus();return}publish.disabled=true;status.textContent='Публикую…';try{const image_base64=await readBase64(file);const response=await fetch('/api/publish',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+keyInput.value.trim()},body:JSON.stringify({image_base64,content_type:file.type,filename:file.name,caption:caption.value})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'Ошибка публикации');status.textContent=`Опубликовано в @hackbyt. ID сообщения: ${data.message_id}`;}catch(error){status.textContent='Ошибка: '+error.message;publish.disabled=false;}});
</script>
</body>
</html>
